# The host Nginx keeps the existing named virtual hosts for AI resume.
# Only direct requests to the server IP are routed to IAM.
server {
    listen 80 default_server;
    server_name 175.178.62.55;
    if ($host != 175.178.62.55) { return 444; }
    return 301 https://175.178.62.55$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name 175.178.62.55;
    ssl_certificate /opt/iam/shared/tls/ip.crt;
    ssl_certificate_key /opt/iam/shared/tls/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host != 175.178.62.55) { return 444; }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-IAM-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
