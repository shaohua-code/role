# 配置文件由 nginx.conf 在 http 上下文中加载。只记 URI 路径，不记录原始 request、
# request_uri、args 或 Referer，避免 OIDC query token 进入静态入口访问日志。
log_format iam_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time $upstream_status';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log iam_redacted;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # IAM 前端与 API 同源；外部 TLS 在 Caddy 终止，API 和 PostgreSQL 不发布宿主机端口。
    # 只传递由外层 Caddy 重写的专用来源地址头；不信任或转发客户端提交的常见转发地址头。
    # Nginx 错误诊断可能包含原始 request line；登出路径的错误级别日志关闭，
    # 其状态码仍保留在上面的脱敏访问日志中，应用错误仍由 API 日志记录。
    location = /api/v1/oidc/logout {
        error_log /dev/null emerg;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-IAM-Client-IP $http_x_iam_client_ip;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-IAM-Client-IP $http_x_iam_client_ip;
        proxy_read_timeout 60s;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://api:8000/.well-known/openid-configuration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-IAM-Client-IP $http_x_iam_client_ip;
    }

    location = /assets/ {
        return 404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx 1.27 location-level add_header replaces (rather than merges) the server list.
        # Repeat every security header so hashed assets retain the same protection.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # Keep security headers on the SPA document despite the location-level cache header.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
